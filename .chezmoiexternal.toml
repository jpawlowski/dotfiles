{{ $ageVersion := "1.3.2" -}}
[".local/bin/age"]
    type = "file"
    url = "https://github.com/FiloSottile/age/releases/download/v{{ $ageVersion }}/age-v{{ $ageVersion }}-{{ .chezmoi.os }}-{{ .chezmoi.arch }}.tar.gz"
    executable = true
    refreshPeriod = "168h"
    [".local/bin/age".filter]
        command = "tar"
        args = ["--extract", "--file", "/dev/stdin", "--gzip", "--to-stdout", "age/age"]
[".local/share/.tmux"]
    type = "archive"
    url = "https://github.com/gpakosz/.tmux/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"
[".local/share/iterm2/iterm2_shell_integration.bash"]
    type = "file"
    url = "https://iterm2.com/shell_integration/bash"
    refreshPeriod = "168h"
[".local/share/iterm2/iterm2_shell_integration.zsh"]
    type = "file"
    url = "https://iterm2.com/shell_integration/zsh"
    refreshPeriod = "168h"    
[".vim/autoload/plug.vim"]
    type = "file"
    url = "https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim"
    refreshPeriod = "168h"
[".oh-my-zsh"]
    type = "archive"
    url = "https://github.com/ohmyzsh/ohmyzsh/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"
[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"
    include = ["*/*.zsh", "*/.version", "*/.revision-hash", "*/highlighters/**"]
[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-autosuggestions/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"
[".oh-my-zsh/custom/plugins/zsh-history-substring-search"]
    type = "archive"
    url = "https://github.com/zsh-users/zsh-history-substring-search/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"
{{ $powerlevel10kVersion := "1.20.0" -}}
[".oh-my-zsh/custom/themes/powerlevel10k"]
    type = "archive"
    url = "https://github.com/romkatv/powerlevel10k/archive/v{{ $powerlevel10kVersion }}.tar.gz"
    exact = true
    stripComponents = 1
{{ $cascadiaVersion := "2407.24" -}}
["Library/Fonts/CascadiaCodeNF.ttf"]
    type = "archive-file"
    url = "https://github.com/microsoft/cascadia-code/releases/download/v{{ $cascadiaVersion }}/CascadiaCode-{{ $cascadiaVersion }}.zip"
    path = "ttf/CascadiaCodeNF.ttf"
    refreshPeriod = "168h"
["Library/Fonts/CascadiaCodeNFItalic.ttf"]
    type = "archive-file"
    url = "https://github.com/microsoft/cascadia-code/releases/download/v{{ $cascadiaVersion }}/CascadiaCode-{{ $cascadiaVersion }}.zip"
    path = "ttf/CascadiaCodeNFItalic.ttf"
    refreshPeriod = "168h"
["Library/Fonts/CascadiaMonoNF.ttf"]
    type = "archive-file"
    url = "https://github.com/microsoft/cascadia-code/releases/download/v{{ $cascadiaVersion }}/CascadiaCode-{{ $cascadiaVersion }}.zip"
    path = "ttf/CascadiaMonoNF.ttf"
    refreshPeriod = "168h"
["Library/Fonts/CascadiaMonoNFItalic.ttf"]
    type = "archive-file"
    url = "https://github.com/microsoft/cascadia-code/releases/download/v{{ $cascadiaVersion }}/CascadiaCode-{{ $cascadiaVersion }}.zip"
    path = "ttf/CascadiaMonoNFItalic.ttf"
    refreshPeriod = "168h"
